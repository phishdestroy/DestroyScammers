name: Script dependency checks
on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/maintenance-checks.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m compileall -q scripts
      - run: python -c "import requests, dotenv, dns.resolver"
